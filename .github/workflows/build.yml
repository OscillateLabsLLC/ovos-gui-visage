name: Build

# Pre-built, unsigned desktop bundles, the web build and the sidecar image, so a change can be tried without a Flutter toolchain per platform.
# Linux is a CI-only target for now (docs/SCOPE.md), so PRs build it too. Artifacts keep 3 days.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.47.4"

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      # `flutter build macos` cannot skip signing; generate the project and build it unsigned with xcodebuild,
      # since the Runner project carries the Oscillate Labs team the runner cannot authenticate as.
      - run: flutter build macos --release --config-only
      - name: Build macOS via xcodebuild (unsigned)
        run: |
          xcodebuild \
            -workspace macos/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -derivedDataPath build/macos/derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build
      - name: Zip macOS app bundle
        run: |
          cd build/macos/derived/Build/Products/Release
          zip -r "$GITHUB_WORKSPACE/ovos-gui-visage-macos.zip" ovos_gui_visage.app
      - uses: actions/upload-artifact@v4
        with:
          name: ovos-gui-visage-macos
          path: ovos-gui-visage-macos.zip
          retention-days: 3

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev libx11-dev libxi-dev
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Tar Linux bundle
        run: |
          cd build/linux/x64/release/bundle
          tar -czf "$GITHUB_WORKSPACE/ovos-gui-visage-linux-x64.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: ovos-gui-visage-linux-x64
          path: ovos-gui-visage-linux-x64.tar.gz
          retention-days: 3


  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release
      - name: Tar web bundle
        run: |
          cd build/web
          tar -czf "$GITHUB_WORKSPACE/ovos-gui-visage-web.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: ovos-gui-visage-web
          path: ovos-gui-visage-web.tar.gz
          retention-days: 3

  # Builds the sidecar image to prove the Dockerfile and nginx template; publishing is a release concern (SCOPE phase 5).
  build-sidecar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f sidecar/Dockerfile -t ovos-gui-visage-sidecar .
      - name: Render the nginx config and check its syntax
        run: |
          # nginx resolves the upstream while checking; host.docker.internal only exists on Docker Desktop, so give
          # the runner's Docker the same name the way compose.yaml does.
          docker run --rm --add-host host.docker.internal:host-gateway ovos-gui-visage-sidecar sh -c \
            '/docker-entrypoint.d/20-envsubst-on-templates.sh >/dev/null && nginx -t'
