name: ovos_gui_visage
description: "Flutter GUI client for OpenVoiceOS in the style of the 2018 Mycroft Mark II Kickstarter concept"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  http: ^1.6.0
  lottie: ^3.6.1
  path: ^1.9.1
  screen_retriever: ^0.2.0
  tray_manager: ^0.5.3
  web_socket_channel: ^3.0.3
  webview_flutter: ^4.14.1
  webview_flutter_web: ^0.2.3+4
  window_manager: ^0.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/tray/
    - docs/face-palettes.html
